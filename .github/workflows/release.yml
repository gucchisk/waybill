name: release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run go test
        run: go test ./...

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes

  bump-tap:
    needs: release
    runs-on: ubuntu-latest
    env:
      TAP_REPOSITORY: gucchisk/homebrew-tap
      FORMULA_PATH: Formula/waybill.rb
    steps:
      - name: Compute version and tarball checksum
        id: source
        run: |
          version="${GITHUB_REF_NAME#v}"
          tarball_url="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz"
          tarball_sha256="$(curl -fsSL "$tarball_url" | sha256sum | cut -d' ' -f1)"
          {
            echo "version=$version"
            echo "tarball_url=$tarball_url"
            echo "tarball_sha256=$tarball_sha256"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.TAP_REPOSITORY }}
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Update formula
        env:
          TARBALL_URL: ${{ steps.source.outputs.tarball_url }}
          TARBALL_SHA256: ${{ steps.source.outputs.tarball_sha256 }}
        run: |
          # Replace url/sha256 and drop the old bottle block; brew pr-pull adds a new one.
          # cat -s squeezes the blank lines left behind by the removed block.
          sed \
            -e "s|^  url \".*\"|  url \"${TARBALL_URL}\"|" \
            -e "s|^  sha256 \".*\"|  sha256 \"${TARBALL_SHA256}\"|" \
            -e '/^  bottle do$/,/^  end$/d' \
            "$FORMULA_PATH" | cat -s > "$RUNNER_TEMP/formula.rb"
          mv "$RUNNER_TEMP/formula.rb" "$FORMULA_PATH"
          git diff

      - name: Open pull request
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.source.outputs.version }}
        run: |
          branch="waybill-${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "waybill ${VERSION}"
          git push origin "$branch"
          gh pr create --repo "$TAP_REPOSITORY" --head "$branch" \
            --title "waybill ${VERSION}" \
            --body "Update waybill to ${VERSION} (${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME})."
